[project]
name = "llm-serving-internals"
version = "0.1.0"
description = "Hand-rolled LLM serving internals (KV cache, batching, continuous batching) benchmarked against vLLM, with hardware capability as part of the experiment."
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "torch",
    "transformers>=5.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_serving"]

[tool.uv.sources]
torch = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
venvPath = "."
venv = ".venv"
